<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="robots" content="noindex">
<title>Buzzkill · Control</title>
<script>
(function() {
  try {
    var saved = localStorage.getItem('regicide-theme');
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    var theme = saved || (prefersLight ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = theme === 'light' ? '#DDD5D0' : '#0f1419';
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../quiz.css">
</head>
<body class="admin">
<header class="site-bar">
  <a class="site-logo" href="/">w-hodgson</a>
  <div class="bar-right">
    <span id="listen-status" class="listen-pill"></span>
    <button id="open-show" type="button" class="bar-btn">Open show window</button>
    <button id="theme-toggle" type="button" aria-label="Toggle theme">☀</button>
  </div>
</header>

<main class="admin-main">
  <details class="panel setup" id="setup">
    <summary><h3>Setup</h3></summary>
    <div class="setup-grid">
      <div class="field">
        <span class="field-label">Questions</span>
        <div class="row">
          <button id="load-questions" type="button">Load question file…</button>
          <button id="load-sample" type="button">Use sample questions</button>
        </div>
        <input type="file" id="questions-file" accept=".json,application/json" hidden>
        <p id="questions-status" class="muted small"></p>
      </div>
      <div class="field">
        <label class="field-label" for="team-0-name">Team on buzzer <kbd>A</kbd></label>
        <input type="text" id="team-0-name" autocomplete="off">
        <label class="field-label" for="team-1-name">Team on buzzer <kbd>B</kbd></label>
        <input type="text" id="team-1-name" autocomplete="off">
      </div>
      <div class="field">
        <span class="field-label">Buzzer test</span>
        <button id="test-toggle" type="button">Start buzzer test</button>
        <div class="test-lights">
          <span id="light-0" class="light team-0">A</span>
          <span id="light-1" class="light team-1">B</span>
        </div>
        <p class="muted small">Lights up (on both screens) when a buzzer is pressed.</p>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="show-text"> Show starter question text on the big screen (otherwise you read it out; bonus questions are always shown)</label>
    <div class="row">
      <button id="start-quiz" type="button" class="primary">Start new game</button>
      <button id="reset-game" type="button">Reset game</button>
    </div>
  </details>

  <div class="admin-grid">
    <section class="panel control">
      <div class="control-head">
        <h3 id="phase-label">Setup</h3>
        <span id="progress" class="muted small"></span>
      </div>
      <div id="question-card" class="question-card"></div>
      <div id="buzz-status"></div>
      <div id="actions" class="actions row"></div>
      <div class="nav row">
        <button id="prev-starter" type="button">← Previous starter</button>
        <button id="next-starter" type="button">Skip to next starter →</button>
        <button id="end-quiz" type="button">End quiz</button>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <h3>Scores</h3>
        <div id="score-rows"></div>
      </section>

      <section class="panel">
        <h3>Timer</h3>
        <div class="row">
          <button type="button" data-timer="5">5s</button>
          <button type="button" data-timer="10">10s</button>
          <button type="button" data-timer="15">15s</button>
          <button type="button" data-timer="30">30s</button>
          <button type="button" id="timer-stop">Stop</button>
          <span id="timer-readout" class="timer-readout">—</span>
        </div>
      </section>

      <section class="panel">
        <h3>Soundboard</h3>
        <div id="soundboard" class="soundboard"></div>
        <div class="row">
          <button id="add-sounds" type="button">Add sound files…</button>
          <button id="stop-sounds" type="button">Stop all sounds</button>
        </div>
        <input type="file" id="sound-files" accept="audio/*" multiple hidden>
        <label class="volume">Volume <input type="range" id="volume" min="0" max="1" step="0.05"></label>
      </section>
    </aside>
  </div>
</main>

<script src="../../theme.js"></script>
<script src="../shared.js"></script>
<script src="../sounds.js"></script>
<script src="../admin.js"></script>
</body>
</html>

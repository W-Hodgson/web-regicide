<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>MESBG tracker</title>
<script>
(function() {
  try {
    var saved = localStorage.getItem('regicide-theme');
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    var theme = saved || (prefersLight ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = theme === 'light' ? '#DDD5D0' : '#0f1419';
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="theme-toggle" type="button" aria-label="Toggle theme">☀</button>
<div id="root">

  <section id="lobby">
    <h1 class="title">MESBG tracker</h1>
    <p class="subtitle muted">A companion for Middle-earth Strategy Battle Game. Two players, peer-to-peer.</p>
    <div class="panel">
      <label class="field">
        <span>Your name</span>
        <input id="name-input" type="text" maxlength="16" placeholder="Captain" autocomplete="off">
      </label>
      <div class="lobby-actions">
        <button id="solo-btn" class="primary">Play solo (run both armies)</button>
        <div class="or muted">— or —</div>
        <button id="create-btn">Create a new room</button>
        <div class="or muted">— or —</div>
        <div class="join-row">
          <input id="join-code" type="text" placeholder="ROOM" maxlength="5" autocomplete="off" spellcheck="false">
          <button id="join-btn">Join</button>
        </div>
      </div>
      <p id="lobby-status" class="muted small"></p>
    </div>
    <p class="footer muted small"><a href="../" class="back-link">← back to menu</a></p>
  </section>

  <section id="setup" hidden>
    <div class="setup-header">
      <div>
        <h2>Set up your forces</h2>
        <p class="muted small" id="setup-subtitle">Share the code below with your opponent.</p>
      </div>
      <div class="setup-header-right">
        <span id="setup-room-code" class="code"></span>
        <button id="setup-leave-btn">Leave</button>
      </div>
    </div>

    <div id="setup-armies"></div>

    <div class="setup-footer">
      <p id="setup-status" class="muted small"></p>
      <button id="setup-start-btn" class="primary" disabled>Start the battle</button>
    </div>
  </section>

  <section id="game" hidden>
    <div class="game-header">
      <h2 id="game-header-title">Battle</h2>
      <div class="game-header-actions">
        <button id="game-reset-btn" hidden>Back to setup</button>
        <button id="game-leave-btn">Leave</button>
      </div>
    </div>

    <div id="game-armies"></div>

    <div class="panel" id="game-log-panel">
      <h3>Log</h3>
      <ul id="game-log"></ul>
    </div>
  </section>

</div>
<script src="../theme.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
